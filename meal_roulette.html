<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 뭐 먹지? 식사 메뉴 룰렛</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#1e293b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e0f2fe,#fef3c7);min-height:100vh;padding:22px}main{max-width:950px;margin:auto}h1{text-align:center;font-size:clamp(27px,5vw,42px);margin:14px 0 6px}p{text-align:center;color:#64748b}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:24px}.panel{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 32px #3341551c}.wheel-wrap{position:relative;max-width:480px;margin:12px auto 20px;aspect-ratio:1}.wheel-wrap:before{content:'';position:absolute;z-index:3;top:-9px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #ef4444;filter:drop-shadow(0 2px 2px #0003)}canvas{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 8px 18px #0002;border:8px solid white}button{border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#2563eb;color:white;width:100%;font-size:20px}.secondary{background:#e2e8f0;color:#334155}.result{min-height:56px;text-align:center;font-size:24px;font-weight:800;color:#db2777;padding:12px}h2{margin:0 0 12px;font-size:21px}.entry{display:flex;gap:8px}.entry input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:16px}.entry button{background:#0f766e;color:white}.items{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;max-height:310px;overflow:auto}.chip{background:#f1f5f9;padding:8px 10px;border-radius:100px;display:flex;gap:8px;align-items:center}.chip button{padding:0 5px;background:none;color:#dc2626;font-size:20px}.actions{display:flex;gap:8px}.actions button{flex:1}.hint{font-size:13px;line-height:1.6;text-align:left}.count{color:#64748b;font-size:14px}@media(max-width:720px){.layout{grid-template-columns:1fr}body{padding:12px}.panel{padding:16px}}</style></head><body><main><h1>🍱 오늘 뭐 먹지?</h1><p>고민은 그만! 돌림판이 오늘의 메뉴를 골라드려요.</p><div class="layout"><section class="panel"><div class="wheel-wrap"><canvas id="wheel" width="900" height="900" aria-label="식사 메뉴 돌림판"></canvas></div><button id="spin" class="primary">🎯 돌림판 돌리기</button><div id="result" class="result" aria-live="polite">오늘의 메뉴는?</div></section><section class="panel"><h2>📝 식사 메뉴 편집</h2><div class="entry"><input id="newMenu" maxlength="22" placeholder="예: 돈가스" aria-label="새 메뉴"><button id="add">추가</button></div><div class="count" id="count"></div><div id="items" class="items"></div><div class="actions"><button id="reset" class="secondary">기본 메뉴</button><button id="clear" class="secondary">전체 삭제</button></div><p class="hint">메뉴를 추가하거나 ×로 삭제하세요. 변경 사항은 이 브라우저에 자동 저장됩니다. 최소 2개 메뉴가 있어야 돌릴 수 있습니다.</p></section></div></main><script>const defaults=['김치찌개','된장찌개','제육볶음','돈가스','비빔밥','칼국수','초밥','햄버거','짜장면','삼겹살'];const colors=['#fb7185','#fbbf24','#34d399','#60a5fa','#c084fc','#fb923c','#2dd4bf','#a78bfa','#f472b6','#a3e635'];const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spinBtn=document.getElementById('spin'),result=document.getElementById('result'),items=document.getElementById('items'),count=document.getElementById('count');let menus;try{const saved=JSON.parse(localStorage.getItem('mealRouletteMenus'));menus=Array.isArray(saved)?saved.filter(x=>typeof x==='string'&&x.trim()).slice(0,40):[...defaults]}catch{menus=[...defaults]}let angle=0,spinning=false;function save(){try{localStorage.setItem('mealRouletteMenus',JSON.stringify(menus))}catch{}}function draw(){const n=menus.length,w=canvas.width,c=w/2,r=c-10;ctx.clearRect(0,0,w,w);if(!n){ctx.fillStyle='#f1f5f9';ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#475569';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText('메뉴를 추가하세요',c,c);return}const slice=2*Math.PI/n;for(let i=0;i<n;i++){const start=angle+i*slice-Math.PI/2,end=start+slice;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(start+slice/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#172033';ctx.font=`bold ${Math.max(17,Math.min(35,360/n+9))}px sans-serif`;let name=menus[i];if(name.length>11)name=name.slice(0,10)+'…';ctx.fillText(name,r-35,0,r-100);ctx.restore()}ctx.beginPath();ctx.arc(c,c,48,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#2563eb';ctx.font='bold 31px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GO!',c,c)}function render(){items.replaceChildren();menus.forEach((m,i)=>{const chip=document.createElement('span');chip.className='chip';const label=document.createElement('span');label.textContent=m;const del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label',m+' 삭제');del.onclick=()=>{if(spinning)return;menus.splice(i,1);save();render()};chip.append(label,del);items.append(chip)});count.textContent=`현재 ${menus.length}개 메뉴 (최대 40개)`;spinBtn.disabled=spinning||menus.length<2;draw()}function add(){if(spinning)return;const input=document.getElementById('newMenu'),v=input.value.trim();if(!v)return;if(menus.length>=40){alert('메뉴는 최대 40개까지 추가할 수 있습니다.');return}menus.push(v);input.value='';save();render();input.focus()}document.getElementById('add').onclick=add;document.getElementById('newMenu').addEventListener('keydown',e=>{if(e.key==='Enter')add()});document.getElementById('reset').onclick=()=>{if(spinning)return;menus=[...defaults];save();result.textContent='오늘의 메뉴는?';render()};document.getElementById('clear').onclick=()=>{if(spinning)return;if(confirm('메뉴를 모두 삭제할까요?')){menus=[];save();result.textContent='메뉴를 추가해 주세요';render()}};spinBtn.onclick=()=>{if(spinning||menus.length<2)return;spinning=true;spinBtn.disabled=true;result.textContent='🎲 메뉴 고르는 중...';const n=menus.length,selected=Math.floor(Math.random()*n),slice=2*Math.PI/n;const current=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);const desired=((2*Math.PI-(selected+.5)*slice)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);const delta=((desired-current+2*Math.PI)%(2*Math.PI))+2*Math.PI*(5+Math.floor(Math.random()*3));const start=performance.now(),duration=4500;function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);angle=current+delta*ease;draw();if(t<1){requestAnimationFrame(frame)}else{angle=desired;spinning=false;result.textContent='🎉 오늘은 '+menus[selected]+'!';render()}}requestAnimationFrame(frame)};render();</script></body></html>
